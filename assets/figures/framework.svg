<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Six components of an environment for LLM agents</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4047"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>

  <!-- Agent (outside the environment) -->
  <rect x="180" y="18" width="520" height="66" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">LLM Agent</text>
  <text x="440" y="68" text-anchor="middle" font-size="13" fill="#57606a">policy + harness (prompts, tools, context, budget) — not part of the environment</text>

  <!-- Environment container -->
  <rect x="16" y="128" width="928" height="276" rx="14" fill="#fbfbfc" stroke="#3c4047" stroke-width="1.6"/>
  <text x="36" y="154" font-size="16" font-weight="700" fill="#1f2328">Environment</text>
  <text x="140" y="154" font-size="12.5" fill="#57606a">everything that changes what the agent observes, can do, or is scored on</text>

  <!-- Group: execution substrate -->
  <rect x="40" y="176" width="135" height="104" rx="9" fill="#e8f0fe" stroke="#4a78c8" stroke-width="1.4"/>
  <text x="107.5" y="204" text-anchor="middle" font-size="12" fill="#4a78c8" font-weight="700">1</text>
  <text x="107.5" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Runtime</text>
  <text x="107.5" y="252" text-anchor="middle" font-size="12" fill="#3c4047">where it executes</text>

  <rect x="190" y="176" width="135" height="104" rx="9" fill="#e8f0fe" stroke="#4a78c8" stroke-width="1.4"/>
  <text x="257.5" y="204" text-anchor="middle" font-size="12" fill="#4a78c8" font-weight="700">2</text>
  <text x="257.5" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Interface</text>
  <text x="257.5" y="252" text-anchor="middle" font-size="12" fill="#3c4047">what it sees and does</text>

  <!-- Group: world -->
  <rect x="340" y="176" width="135" height="104" rx="9" fill="#e7f6ec" stroke="#3f9b5f" stroke-width="1.4"/>
  <text x="407.5" y="204" text-anchor="middle" font-size="12" fill="#3f9b5f" font-weight="700">3</text>
  <text x="407.5" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">State</text>
  <text x="407.5" y="252" text-anchor="middle" font-size="12" fill="#3c4047">what the world holds</text>

  <rect x="490" y="176" width="135" height="104" rx="9" fill="#e7f6ec" stroke="#3f9b5f" stroke-width="1.4"/>
  <text x="557.5" y="204" text-anchor="middle" font-size="12" fill="#3f9b5f" font-weight="700">4</text>
  <text x="557.5" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Dynamics</text>
  <text x="557.5" y="250" text-anchor="middle" font-size="12" fill="#3c4047">how it changes</text>
  <text x="557.5" y="266" text-anchor="middle" font-size="12" fill="#3c4047">and who else acts</text>

  <!-- Group: task and judgment -->
  <rect x="640" y="176" width="135" height="104" rx="9" fill="#fdf0e2" stroke="#c97a2b" stroke-width="1.4"/>
  <text x="707.5" y="204" text-anchor="middle" font-size="12" fill="#c97a2b" font-weight="700">5</text>
  <text x="707.5" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Task</text>
  <text x="707.5" y="252" text-anchor="middle" font-size="12" fill="#3c4047">what to achieve</text>

  <rect x="790" y="176" width="135" height="104" rx="9" fill="#fdf0e2" stroke="#c97a2b" stroke-width="1.4"/>
  <text x="857.5" y="204" text-anchor="middle" font-size="12" fill="#c97a2b" font-weight="700">6</text>
  <text x="857.5" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Verification</text>
  <text x="857.5" y="252" text-anchor="middle" font-size="12" fill="#3c4047">what counts as success</text>

  <!-- Group brackets -->
  <path d="M40 300 v10 h285 v-10" fill="none" stroke="#4a78c8" stroke-width="1.4"/>
  <text x="182.5" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#4a78c8">Execution substrate</text>
  <path d="M340 300 v10 h285 v-10" fill="none" stroke="#3f9b5f" stroke-width="1.4"/>
  <text x="482.5" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#3f9b5f">World</text>
  <path d="M640 300 v10 h285 v-10" fill="none" stroke="#c97a2b" stroke-width="1.4"/>
  <text x="782.5" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#c97a2b">Task and judgment</text>

  <text x="480" y="378" text-anchor="middle" font-size="12" fill="#57606a">Components separate responsibilities; their configurations still depend on and constrain one another.</text>

  <!-- Interaction arrows -->
  <line x1="245" y1="88" x2="245" y2="172" stroke="#3c4047" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="270" y1="172" x2="270" y2="88" stroke="#3c4047" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="236" y="122" text-anchor="end" font-size="12.5" fill="#1f2328">actions</text>
  <text x="280" y="122" font-size="12.5" fill="#1f2328">observations</text>

  <polyline points="857.5,172 857.5,51 704,51" fill="none" stroke="#3c4047" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="866" y="96" font-size="12.5" fill="#1f2328">evaluation</text>
  <text x="866" y="112" font-size="12.5" fill="#1f2328">signal</text>
</svg>
